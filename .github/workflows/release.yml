name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options: [beta, stable]
        default: beta

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npx electron-builder --win --publish never
            artifact: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
            name: windows
          - os: macos-latest
            command: npx electron-builder --mac --publish never
            artifact: |
              release/*.dmg
              release/*.dmg.blockmap
              release/latest-mac.yml
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Match package version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node -e "const fs=require('fs');const p=require('./package.json');p.version=process.env.GITHUB_REF_NAME.slice(1);fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"
      - run: npm run typecheck
      - run: npm run test:backend
      - run: npm run build:web
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: hedge-lbank-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Resolve channel
        id: channel
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          requested="${{ inputs.channel }}"
          if [[ "$tag" == *-beta.* || "$requested" == "beta" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=Beta ${tag:-manual}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=Hedge LBank ${tag}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.channel.outputs.name }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          generate_release_notes: true
          files: artifacts/*
